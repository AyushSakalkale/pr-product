name: DepGuard Security Check

on:
  pull_request:
    paths:
      - 'package.json'
      - 'requirements.txt'
      - 'Gemfile'
      - 'go.mod'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'depguard/package-lock.json'

      - name: Install DepGuard
        run: |
          cd depguard
          npm install
          echo "DEP_GUARD_PATH=$(pwd)/index.js" >> $GITHUB_ENV

      - name: Detect Changed Packages
        id: detect
        run: |
          git fetch origin main:main
          CHANGED_PACKAGES=""
          if git diff main...HEAD package.json | grep -q '^\+ '; then
            # Extract added lines, remove plus sign, join into one line, and wrap in a JSON object
            DIFF_CONTENT=$(git diff main...HEAD package.json | grep '^\+ ' | sed 's/^\+//' | tr -d '\n' | sed 's/,$//')
            NPM_CHANGES=$(echo "{ \"dependencies\": { $DIFF_CONTENT } }" | jq -r '.dependencies // {} | keys[]' | xargs)
            CHANGED_PACKAGES="$CHANGED_PACKAGES $NPM_CHANGES"
          fi
          if git diff main...HEAD requirements.txt | grep -q '^+'; then
            PY_CHANGES=$(git diff main...HEAD requirements.txt | grep '^+[a-zA-Z]' | sed 's/+//' | cut -d'=' -f1 | cut -d'>' -f1 | xargs)
            CHANGED_PACKAGES="$CHANGED_PACKAGES $PY_CHANGES"
          fi
          PACKAGES=$(echo "$CHANGED_PACKAGES" | xargs)
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
          echo "Detected packages: $PACKAGES"

      - name: Run DepGuard and Comment
        if: steps.detect.outputs.packages != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_BODY="### 🛡️ DepGuard Dependency Analysis\n\n"
          FAILED=false
          for pkg in ${{ steps.detect.outputs.packages }}; do
            echo "Analyzing $pkg..."
            OUTPUT=$(node $DEP_GUARD_PATH $pkg)
            SCORE=$(echo "$OUTPUT" | grep "Final Score:" | awk '{print $3}')
            MAINTENANCE=$(echo "$OUTPUT" | grep "Maintenance Score:" | awk '{print $3}')
            SUMMARY=$(echo "$OUTPUT" | sed -n '/----------------------------/,$p' | tail -n +3)
            COMMENT_BODY="$COMMENT_BODY**Package:** \`$pkg\`  \n"
            COMMENT_BODY="$COMMENT_BODY**Score:** $SCORE / 100 | **Maintenance:** $MAINTENANCE / 100 \n"
            COMMENT_BODY="$COMMENT_BODY<details><summary>Detailed Analysis</summary>\n\n$SUMMARY\n\n</details>\n\n---\n"
            if [ "$SCORE" -lt 50 ]; then
              FAILED=true
            fi
          done
          gh pr comment $PR_NUMBER --edit-last --body "$(echo -e "$COMMENT_BODY")" || gh pr comment $PR_NUMBER --body "$(echo -e "$COMMENT_BODY")"
          if [ "$FAILED" = true ]; then
            echo "One or more packages scored below 50. Failing the check."
            exit 1
          fi

  tree-scan:
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'depguard/package-lock.json'

      - name: Install DepGuard Tool Dependencies
        run: |
          cd depguard
          npm install

      - name: Install Project Dependencies to Scan
        run: |
          # Verify package.json exists and has a dependencies field before running npm install
          if [ -f package.json ] && grep -q '"dependencies":' package.json; then
            npm install
          else
            echo "No root dependencies to install."
          fi

      - name: Run Full Tree Scan
        id: scan
        run: |
          # Use piped input 'n' to select the top 20 alphabetically and avoid terminal hang
          SCAN_OUTPUT=$(echo 'n' | node depguard/scan.js .)
          
          # Use multi-line output handling for GitHub Actions
          echo "scan_results<<EOF" >> $GITHUB_ENV
          echo "$SCAN_OUTPUT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          echo "$SCAN_OUTPUT"

      - name: Post Tree Scan Comment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment $PR_NUMBER --edit-last --body "### 🌲 DepGuard Tree Scan Results
          \`\`\`text
          ${{ env.scan_results }}
          \`\`\`" || gh pr comment $PR_NUMBER --body "### 🌲 DepGuard Tree Scan Results
          \`\`\`text
          ${{ env.scan_results }}
          \`\`\`"

      - name: Evaluate Transitive Risks
        run: |
          # Search for any transitive package with a score below 25
          # Regex matches patterns like: - name (0-24/100) [Transitive]
          if echo "${{ env.scan_results }}" | grep "\[Transitive\]" | grep -E "\(([0-9]|1[0-9]|2[0-4])\/100\)"; then
            echo "Tree scan failed. Critical risk transitive dependency detected."
            exit 1
          fi
