name: DepGuard Security Check

on:
  pull_request:
    paths:
      - 'package.json'
      - 'requirements.txt'
      - 'Gemfile'
      - 'go.mod'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'depguard/package-lock.json'

      - name: Install DepGuard
        run: |
          cd depguard
          npm install
          echo "DEP_GUARD_PATH=$(pwd)/index.js" >> $GITHUB_ENV

      - name: Detect Changed Packages
        id: detect
        run: |
          git fetch origin main:main
          CHANGED_PACKAGES=""

          # Compare old vs new package.json dependencies using jq on full file snapshots
          if git diff main...HEAD -- package.json | grep -q '^+'; then
            OLD_DEPS=$(git show main:package.json 2>/dev/null | jq -r '.dependencies // {} | keys[]' 2>/dev/null | sort || echo "")
            NEW_DEPS=$(git show HEAD:package.json 2>/dev/null | jq -r '.dependencies // {} | keys[]' 2>/dev/null | sort || echo "")
            NPM_CHANGES=$(comm -13 <(echo "$OLD_DEPS") <(echo "$NEW_DEPS") | xargs)
            CHANGED_PACKAGES="$CHANGED_PACKAGES $NPM_CHANGES"
          fi

          if git diff main...HEAD -- requirements.txt | grep -q '^+'; then
            PY_CHANGES=$(git diff main...HEAD requirements.txt | grep '^+[a-zA-Z]' | sed 's/+//' | cut -d'=' -f1 | cut -d'>' -f1 | xargs)
            CHANGED_PACKAGES="$CHANGED_PACKAGES $PY_CHANGES"
          fi

          PACKAGES=$(echo "$CHANGED_PACKAGES" | xargs)
          echo "packages=$PACKAGES" >> $GITHUB_OUTPUT
          echo "Detected packages: $PACKAGES"

      - name: Run DepGuard and Comment
        if: steps.detect.outputs.packages != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUB_PAT: ${{ secrets.HUB_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          COMMENT_BODY="### 🛡️ DepGuard Dependency Analysis\n\n"
          ANY_BLOCKED=false
          
          for pkg in ${{ steps.detect.outputs.packages }}; do
            echo "Analyzing $pkg..."
            OUTPUT=$(node $DEP_GUARD_PATH $pkg)
            SCORE=$(echo "$OUTPUT" | grep "Final Score:" | awk '{print $3}')
            MAINTENANCE=$(echo "$OUTPUT" | grep "Maintenance Score:" | awk '{print $3}')
            SUMMARY=$(echo "$OUTPUT" | sed -n '/----------------------------/,$p' | tail -n +3)
            
            IS_BLOCKED=false
            STATUS_MSG="✅ PASS"
            
            # BLOCK Mode Conditions:
            # 1. finalScore below 25
            if [ "$SCORE" -lt 25 ]; then
              IS_BLOCKED=true
              STATUS_MSG="❌ MERGE BLOCKED"
            # 2. unpatched security flaws AND score < 40
            elif echo "$SUMMARY" | grep -q "unpatched security flaws" && [ "$SCORE" -lt 40 ]; then
              IS_BLOCKED=true
              STATUS_MSG="❌ MERGE BLOCKED"
            # 3. officially archived AND score < 30
            elif echo "$SUMMARY" | grep -q "officially archived" && [ "$SCORE" -lt 30 ]; then
              IS_BLOCKED=true
              STATUS_MSG="❌ MERGE BLOCKED"
            # WARN Mode Condition:
            # any package scoring below 50 but above 25
            elif [ "$SCORE" -lt 50 ]; then
              STATUS_MSG="⚠️ REVIEW RECOMMENDED"
            fi

            COMMENT_BODY="$COMMENT_BODY**Package:** \`$pkg\`  \n"
            COMMENT_BODY="$COMMENT_BODY**Status:** $STATUS_MSG \n"
            COMMENT_BODY="$COMMENT_BODY**Score:** $SCORE / 100 | **Maintenance:** $MAINTENANCE / 100 \n"
            
            if [ "$STATUS_MSG" = "⚠️ REVIEW RECOMMENDED" ]; then
                COMMENT_BODY="$COMMENT_BODY> This package has concerns but is not blocking merge. Review before proceeding.\n\n"
            fi

            COMMENT_BODY="$COMMENT_BODY<details><summary>Detailed Analysis</summary>\n\n$SUMMARY\n\n</details>\n\n---\n"
            
            if [ "$IS_BLOCKED" = true ]; then
              ANY_BLOCKED=true
            fi
          done
          
          gh pr comment $PR_NUMBER --edit-last --body "$(echo -e "$COMMENT_BODY")" || gh pr comment $PR_NUMBER --body "$(echo -e "$COMMENT_BODY")"
          
          if [ "$ANY_BLOCKED" = true ]; then
            echo "One or more packages triggered a BLOCK. Failing the check."
            exit 1
          fi

  tree-scan:
    needs: analyze
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HUB_PAT: ${{ secrets.HUB_PAT }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'depguard/package-lock.json'

      - name: Install DepGuard Tool Dependencies
        run: |
          cd depguard
          npm install

      - name: Install Project Dependencies to Scan
        run: |
          # Verify package.json exists and has a dependencies field before running npm install
          if [ -f package.json ] && grep -q '"dependencies":' package.json; then
            npm install
          else
            echo "No root dependencies to install."
          fi

      - name: Run Full Tree Scan
        id: scan
        run: |
          # Use piped input 'n' to select the top 20 alphabetically and avoid terminal hang
          SCAN_OUTPUT=$(echo 'n' | node depguard/scan.js .)
          
          # Use multi-line output handling for GitHub Actions
          echo "scan_results<<EOF" >> $GITHUB_ENV
          echo "$SCAN_OUTPUT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          echo "$SCAN_OUTPUT"

      - name: Post Tree Scan Comment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BLOCK_MSG=""
          if echo "${{ env.scan_results }}" | grep "\[Transitive\]" | grep -E "\(([0-9]|1[0-9]|2[0-4])\/100\)"; then
            BLOCK_MSG="❌ **CRITICAL TRANSITIVE RISKS DETECTED - MERGE BLOCKED**\n\n"
          elif echo "${{ env.scan_results }}" | grep "\[Transitive\]" | grep -E "\(([2][5-9]|[3-4][0-9])\/100\)"; then
            BLOCK_MSG="⚠️ **TRANSITIVE RISKS DETECTED - REVIEW RECOMMENDED**\n> This package has concerns but is not blocking merge. Review before proceeding.\n\n"
          fi

          FULL_BODY="${BLOCK_MSG}### 🌲 DepGuard Tree Scan Results\n\`\`\`text\n${{ env.scan_results }}\n\`\`\`"
          
          gh pr comment $PR_NUMBER --edit-last --body "$(echo -e "$FULL_BODY")" || gh pr comment $PR_NUMBER --body "$(echo -e "$FULL_BODY")"

      - name: Evaluate Transitive Risks
        run: |
          # Search for any transitive package with a score below 25
          # Regex matches patterns like: - name (0-24/100) [Transitive]
          if echo "${{ env.scan_results }}" | grep "\[Transitive\]" | grep -E "\(([0-9]|1[0-9]|2[0-4])\/100\)"; then
            echo "Tree scan failed. Critical risk transitive dependency detected (Score < 25)."
            exit 1
          fi
          
          # Check for warn (25-50)
          if echo "${{ env.scan_results }}" | grep "\[Transitive\]" | grep -E "\(([2][5-9]|[3-4][0-9])\/100\)"; then
             echo "Warning: Moderate risk transitive dependencies detected (25-50). Not blocking merge."
          fi
